image: node:22-alpine

stages:
  - test
  - deploy

validate:
  stage: test
  image: python:3.12-alpine
  script:
    - cd scripts
    - python3 validate.py

build:
  stage: test
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - website/node_modules/
  script:
    - cd website
    - npm ci
    - npm run build

pages:
  stage: deploy
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - website/node_modules/
  script:
    - cd website
    - npm ci
    - npm run build
    - mv dist ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
